apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay-hub
  template:
    metadata:
      labels:
        app: replay-hub
    spec:
      containers:
        - name: replay-hub
          image: docker.io/keanuwatts/theclusterflux:replay-hub
          imagePullPolicy: Always
          env:
          - name: MONGO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mongodb 
                key: mongodb-root-password
          - name: AWS_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: aws-access-key
          - name: AWS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: aws-s3-credentials
                key: aws-secret-key
          - name: USE_R2
            value: "true"
          - name: VIDEO_ENCODING_STRATEGY
            value: "CLIENT"
          - name: R2_ACCOUNT_ID
            value: "9d6f2289d9d11dc3d803f10c01f4a23d"
          - name: R2_BUCKET_NAME
            value: "replay-hub-videos"
          - name: R2_ENDPOINT
            value: "https://9d6f2289d9d11dc3d803f10c01f4a23d.r2.cloudflarestorage.com"
          - name: R2_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: r2-credentials
                key: access-key-id
                optional: true
          - name: R2_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: r2-credentials
                key: secret-access-key
                optional: true
          - name: API_PUBLIC_BASE_URL
            value: "https://replay-hub.theclusterflux.com"
          - name: STREAM_WINDOW_SECONDS
            value: "300"
          - name: STREAM_LOOKBEHIND_SECONDS
            value: "60"
          - name: STREAM_PRESIGN_EXPIRY
            value: "900"
                
      imagePullSecrets:
        - name: dockerhub-secret
---
apiVersion: v1
kind: Service
metadata:
  name: replay-hub
spec:
  selector:
    app: replay-hub
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: replay-hub
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - replay-hub.theclusterflux.com
    secretName: theclusterflux
  rules:
  - host: replay-hub.theclusterflux.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: replay-hub
            port:
              number: 8080
